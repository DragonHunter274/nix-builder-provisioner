{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nix-builder-provisioner.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nix-builder-provisioner.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nix-builder-provisioner.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 2222
      {{- if .Values.networkPolicy.ingressCIDRs }}
      from:
        {{- range .Values.networkPolicy.ingressCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      {{- end }}
    {{- if .Values.ingress.enabled }}
    - ports:
        - protocol: TCP
          port: 8080
    {{- end }}
{{- end }}
